name: Reproducibility report
description: Report a mismatch with the published protocol or metrics
title: "[Reproducibility]: "
labels: [reproducibility]
body:
  - type: input
    id: revision
    attributes:
      label: Git revision
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and configuration
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and hardware
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result and artifact hashes
    validations:
      required: true
  - type: checkboxes
    id: protocol
    attributes:
      label: Protocol integrity
      options:
        - label: I did not use internal-test metrics for model selection.
          required: true
        - label: I did not include restricted dataset files.
          required: true
