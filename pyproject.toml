[project]
name = "rdd2022-cpu-baseline"
version = "0.1.0"
description = "Reproducible CPU-only road damage detection on RDD2022"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
  {name = "Mateus Gomes de Araújo", email = "mathweuzz@gmail.com"},
]
dependencies = [
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "pandas==3.0.0",
  "Pillow==12.3.0",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
experiments = [
  "psutil==7.2.2",
  "pycocotools==2.0.11",
  "PyYAML==6.0.3",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.6.1",
  "ultralytics==8.3.203",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[project.urls]
Repository = "https://github.com/Mathweuzz/rdd2022-cpu-baseline"
Paper = "https://github.com/Mathweuzz/rdd2022-cpu-baseline/blob/main/paper/main.pdf"

[project.scripts]
rdd2022-download = "download_rdd2022:main"
rdd2022-eda = "eda_rdd2022:main"
rdd2022-prepare = "prepare_rdd2022:main"
rdd2022-validate = "validate_rdd2022:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["download_rdd2022", "eda_rdd2022", "prepare_rdd2022", "validate_rdd2022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "experiments"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
